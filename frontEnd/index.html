<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vite-project</title>
</head>

<body class="overscroll-none">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <svg style="display: none;" xmlns="http://w3.org">
    <filter id="figma-refraction-map">
      <!-- Smooth large-scale coordinate wave mapping -->
      <feTurbulence type="fractalNoise" baseFrequency="0.002" numOctaves="1" result="coordBase" />
      <feGaussianBlur in="coordBase" stdDeviation="10" result="smoothCoords" />

      <!-- REFRACTION: 71 (Maps to a scale value of ~32 for smooth distortion) -->
      <feDisplacementMap in="SourceGraphic" in2="smoothCoords" scale="32" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
  <svg style="display: none">
    <filter id="glass-distortion" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox">
      <feTurbulence type="fractalNoise" baseFrequency="0.01 0.01" numOctaves="1" seed="5" result="turbulence" />
      <!-- Seeds: 14, 17,  -->

      <feComponentTransfer in="turbulence" result="mapped">
        <feFuncR type="gamma" amplitude="1" exponent="10" offset="0.5" />
        <feFuncG type="gamma" amplitude="0" exponent="1" offset="0" />
        <feFuncB type="gamma" amplitude="0" exponent="1" offset="0.5" />
      </feComponentTransfer>

      <feGaussianBlur in="turbulence" stdDeviation="3" result="softMap" />

      <feSpecularLighting in="softMap" surfaceScale="5" specularConstant="1" specularExponent="100"
        lighting-color="white" result="specLight">
        <fePointLight x="-200" y="-200" z="300" />
      </feSpecularLighting>

      <feComposite in="specLight" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litImage" />

      <feDisplacementMap in="SourceGraphic" in2="softMap" scale="25" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
</body>

</html>
